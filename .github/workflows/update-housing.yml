name: Update housing data

on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: housing-data-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch current housing notices
        env:
          APPLYHOME_API_KEY: ${{ secrets.APPLYHOME_API_KEY }}
        run: node scripts/update-housing.mjs
      - name: Commit changed data
        run: |
          if git diff --quiet -- data/housing.json; then
            echo "No housing data change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/housing.json
          git commit -m "Update housing data"
          git push
