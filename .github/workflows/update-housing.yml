name: Update housing data

on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: nowfeed-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch current housing notices
        env:
          APPLYHOME_API_KEY: ${{ secrets.APPLYHOME_API_KEY }}
        run: node scripts/update-housing.mjs
      - name: Commit changed data
        run: |
          if git diff --quiet -- data/housing.json; then
            echo "No housing data change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/housing.json
          git commit -m "Update housing data"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish refreshed data to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
