name: Update market data

on:
  schedule:
    - cron: '*/30 0-9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch current market data
        run: node scripts/update-market.mjs
      - name: Commit changed data
        run: |
          if git diff --quiet -- data/market.json; then
            echo "No market data change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          git commit -m "Update market data"
          git push
