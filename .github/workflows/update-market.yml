name: Update market data

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: nowfeed-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch current market data
        id: collect
        continue-on-error: true
        run: node scripts/update-market.mjs
      - name: Commit changed data
        run: |
          if git diff --quiet -- data/market.json; then
            echo "No market data change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          git commit -m "Update market data"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish refreshed data to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
      - name: Report source failures after preserving available data
        if: steps.collect.outcome == 'failure'
        run: exit 1
